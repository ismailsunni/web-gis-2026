<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Yogyakarta - OpenLayers Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .ol-popup {
            position: absolute;
            background: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            max-width: 220px;
            pointer-events: none;
            transform: translate(-50%, -110%);
        }
        .ol-popup b { font-size: 14px; }
        .ol-popup em { color: #6b7280; font-size: 11px; }

        /* Basemap switcher */
        #basemap-switcher {
            position: fixed; top: 1rem; right: 1rem; z-index: 100;
            display: flex; gap: 2px; background: #fff;
            border: 1px solid #e5e7eb; border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1); overflow: hidden;
        }
        #basemap-switcher button {
            padding: 6px 12px; border: none; background: none;
            font-size: 12px; font-weight: 600; color: #9ca3af; cursor: pointer;
        }
        #basemap-switcher button.active { background: #1a1a1a; color: #fff; }
        #basemap-switcher button:not(.active):hover { background: #f3f4f6; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="basemap-switcher">
        <button data-basemap="osm" class="active">OSM</button>
        <button data-basemap="carto">Minimalis</button>
        <button data-basemap="satellite">Satelit</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.js"></script>
    <script src="app.js"></script>
</body>
</html>
