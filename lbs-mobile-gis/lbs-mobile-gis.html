<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Memahami isu <strong>akurasi, privasi, dan baterai</strong></p>

<h1 id="1%EF%B8%8F%E2%83%A3-apa-itu-lbs"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Apa itu LBS?</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="location-based-services-lbs">Location-Based Services (LBS)</h1>
<p><strong>LBS</strong> = layanan yang memanfaatkan <strong>posisi geografis</strong> pengguna untuk memberikan informasi atau fungsi yang relevan.</p>
<blockquote>
<p>&quot;Layanan yang jawabannya <strong>berbeda</strong> tergantung <strong>di mana</strong> kamu berada.&quot;</p>
</blockquote>
<p><strong>Pertanyaan inti yang dijawab LBS:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="📍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cd.svg" data-marp-twemoji=""/> Di mana saya sekarang?</li>
<li><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50e.svg" data-marp-twemoji=""/> Apa yang ada <strong>di dekat</strong> saya?</li>
<li><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Bagaimana cara ke sana?</li>
<li><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f514.svg" data-marp-twemoji=""/> Beri tahu saya saat saya <strong>masuk/keluar</strong> area tertentu</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="contoh-lbs-sehari-hari">Contoh LBS Sehari-hari</h1>
<table>
<thead>
<tr>
<th>Aplikasi</th>
<th>Pemanfaatan Lokasi</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="🗺️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5fa.svg" data-marp-twemoji=""/> Google Maps</td>
<td>Navigasi, &quot;restoran terdekat&quot;</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🛵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6f5.svg" data-marp-twemoji=""/> Gojek / Grab</td>
<td>Cari driver terdekat, ETA</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Shopee / paket</td>
<td>Lacak posisi kurir realtime</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🌧️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f327.svg" data-marp-twemoji=""/> BMKG / cuaca</td>
<td>Prakiraan untuk lokasi kamu</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🏃" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3c3.svg" data-marp-twemoji=""/> Strava</td>
<td>Rekam jejak (track) lari/sepeda</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f514.svg" data-marp-twemoji=""/> Reminder lokasi</td>
<td>&quot;Ingatkan beli kopi saat dekat toko&quot;</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Hampir semua aplikasi mobile populer punya <strong>fitur LBS</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="dua-mode-lbs">Dua Mode LBS</h1>
<table>
<thead>
<tr>
<th>Mode</th>
<th>Penjelasan</th>
<th>Contoh</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Reactive (pull)</strong></td>
<td>Pengguna <strong>meminta</strong> info berdasarkan lokasi</td>
<td>&quot;Cari ATM terdekat&quot;</td>
</tr>
<tr>
<td><strong>Proactive (push)</strong></td>
<td>Sistem <strong>otomatis</strong> bertindak saat kondisi lokasi terpenuhi</td>
<td>Notifikasi promo saat lewat mall (geofencing)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Geofencing</strong> = memicu aksi saat pengguna masuk/keluar batas area virtual.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="2%EF%B8%8F%E2%83%A3-komponen-lbs"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Komponen LBS</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="anatomi-sebuah-layanan-lbs">Anatomi Sebuah Layanan LBS</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌──────────────┐   1. minta posisi    ┌─────────────────┐
│   Pengguna   │ ───────────────────<img class="emoji" draggable="false" alt="▶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25b6.svg" data-marp-twemoji=""/> │  Perangkat +    │
│  + Perangkat │ <img class="emoji" draggable="false" alt="◀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25c0.svg" data-marp-twemoji=""/>─────────────────── │  Sensor Lokasi  │
└──────┬───────┘   2. koordinat       │  (GPS/WiFi/Cell)│
       │ 3. kirim lokasi              └─────────────────┘
       ▼
┌──────────────┐   4. query spasial   ┌─────────────────┐
│  Aplikasi /  │ ───────────────────<img class="emoji" draggable="false" alt="▶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25b6.svg" data-marp-twemoji=""/> │  Server + Basis │
│   Client     │ <img class="emoji" draggable="false" alt="◀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25c0.svg" data-marp-twemoji=""/>─────────────────── │  Data Spasial   │
└──────────────┘   5. hasil relevan   │  (PostGIS, API) │
                                      └─────────────────┘
</code></pre>
<p><strong>Lima komponen klasik LBS:</strong></p>
<ol>
<li><strong>Perangkat</strong> (HP, browser)  2. <strong>Jaringan</strong> (internet/seluler)</li>
<li><strong>Penyedia posisi</strong> (GPS, WiFi, dll.)  4. <strong>Penyedia konten/data</strong> (peta, POI)</li>
<li><strong>Aplikasi/Service</strong> (logika &amp; tampilan)</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="3%EF%B8%8F%E2%83%A3-sumber-lokasi"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Sumber Lokasi</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="dari-mana-posisi-berasal">Dari Mana Posisi Berasal?</h1>
<table>
<thead>
<tr>
<th>Sumber</th>
<th>Akurasi</th>
<th>Catatan</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="🛰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6f0.svg" data-marp-twemoji=""/> <strong>GPS / GNSS</strong></td>
<td>5–10 m</td>
<td>Akurat, butuh langit terbuka, boros baterai</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="📶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4f6.svg" data-marp-twemoji=""/> <strong>WiFi</strong></td>
<td>20–50 m</td>
<td>Cocok indoor, pakai database hotspot</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="📡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e1.svg" data-marp-twemoji=""/> <strong>Cell tower</strong></td>
<td>100–1000 m</td>
<td>Selalu ada sinyal seluler, kasar</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f310.svg" data-marp-twemoji=""/> <strong>IP Address</strong></td>
<td>kota/wilayah</td>
<td>Sangat kasar, untuk web tanpa GPS</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f535.svg" data-marp-twemoji=""/> <strong>Bluetooth / Beacon</strong></td>
<td>&lt; 5 m</td>
<td>Micro-location indoor (mall, museum)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Perangkat sering <strong>menggabungkan</strong> beberapa sumber → <em>hybrid positioning</em>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="a-gps--hybrid-positioning">A-GPS &amp; Hybrid Positioning</h1>
<p><strong>A-GPS (Assisted GPS):</strong> perangkat memakai data jaringan seluler untuk mempercepat fix GPS (dari menit → detik).</p>
<p><strong>Hybrid:</strong> OS menggabungkan GPS + WiFi + Cell + sensor untuk hasil terbaik.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Butuh akurat &amp; di luar ruang  → GPS dominan
Indoor / hemat baterai        → WiFi + Cell
Hanya perlu kota/wilayah      → IP geolocation
</code></pre>
<blockquote>
<p>Sebagai developer, kita <strong>tidak memilih sumbernya</strong> — OS/browser yang menentukan. Kita hanya minta tingkat akurasi.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="4%EF%B8%8F%E2%83%A3-html-geolocation-api"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/34-20e3.svg" data-marp-twemoji=""/> HTML Geolocation API</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="html-geolocation-api">HTML Geolocation API</h1>
<p>API standar <strong>browser</strong> untuk mengakses lokasi pengguna — tanpa library, tanpa plugin.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">if</span> (<span class="hljs-string">&quot;geolocation&quot;</span> <span class="hljs-keyword">in</span> navigator) {
  navigator.<span class="hljs-property">geolocation</span>.<span class="hljs-title function_">getCurrentPosition</span>(
    onSuccess,   <span class="hljs-comment">// callback saat berhasil</span>
    onError,     <span class="hljs-comment">// callback saat gagal</span>
    options      <span class="hljs-comment">// konfigurasi</span>
  );
} <span class="hljs-keyword">else</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Geolocation tidak didukung browser ini&quot;</span>);
}
</code></pre>
<ul>
<li>Tersedia di hampir semua browser modern</li>
<li><strong>Wajib HTTPS</strong> (atau <code>localhost</code>) — alasan keamanan</li>
<li>Selalu minta <strong>izin pengguna</strong> dulu</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="getcurrentposition-sekali-ambil"><code>getCurrentPosition</code>: Sekali Ambil</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">navigator.<span class="hljs-property">geolocation</span>.<span class="hljs-title function_">getCurrentPosition</span>(
  <span class="hljs-function">(<span class="hljs-params">position</span>) =&gt;</span> {
    <span class="hljs-keyword">const</span> lat = position.<span class="hljs-property">coords</span>.<span class="hljs-property">latitude</span>;
    <span class="hljs-keyword">const</span> lon = position.<span class="hljs-property">coords</span>.<span class="hljs-property">longitude</span>;
    <span class="hljs-keyword">const</span> acc = position.<span class="hljs-property">coords</span>.<span class="hljs-property">accuracy</span>; <span class="hljs-comment">// dalam meter</span>
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Posisi: <span class="hljs-subst">${lat}</span>, <span class="hljs-subst">${lon}</span> (±<span class="hljs-subst">${acc}</span> m)`</span>);
  },
  <span class="hljs-function">(<span class="hljs-params">error</span>) =&gt;</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Gagal:&quot;</span>, error.<span class="hljs-property">message</span>);
  },
  {
    <span class="hljs-attr">enableHighAccuracy</span>: <span class="hljs-literal">true</span>,  <span class="hljs-comment">// pakai GPS jika ada</span>
    <span class="hljs-attr">timeout</span>: <span class="hljs-number">10000</span>,            <span class="hljs-comment">// batas tunggu (ms)</span>
    <span class="hljs-attr">maximumAge</span>: <span class="hljs-number">0</span>              <span class="hljs-comment">// jangan pakai cache</span>
  }
);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="objek-position--coords">Objek <code>position</code> &amp; <code>coords</code></h1>
<table>
<thead>
<tr>
<th>Properti</th>
<th>Arti</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>coords.latitude</code></td>
<td>Lintang (derajat)</td>
</tr>
<tr>
<td><code>coords.longitude</code></td>
<td>Bujur (derajat)</td>
</tr>
<tr>
<td><code>coords.accuracy</code></td>
<td>Akurasi horizontal (meter)</td>
</tr>
<tr>
<td><code>coords.altitude</code></td>
<td>Ketinggian (m, bisa <code>null</code>)</td>
</tr>
<tr>
<td><code>coords.heading</code></td>
<td>Arah hadap (derajat dari utara)</td>
</tr>
<tr>
<td><code>coords.speed</code></td>
<td>Kecepatan (m/s)</td>
</tr>
<tr>
<td><code>timestamp</code></td>
<td>Waktu pengukuran</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Koordinat selalu <strong>EPSG:4326 (WGS 84)</strong> — lon/lat derajat desimal.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="watchposition-pantau-terus-menerus"><code>watchPosition</code>: Pantau Terus-menerus</h1>
<p>Untuk navigasi / tracking — dipanggil setiap posisi berubah.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> watchId = navigator.<span class="hljs-property">geolocation</span>.<span class="hljs-title function_">watchPosition</span>(
  <span class="hljs-function">(<span class="hljs-params">position</span>) =&gt;</span> {
    <span class="hljs-title function_">updateMarker</span>(position.<span class="hljs-property">coords</span>.<span class="hljs-property">latitude</span>,
                 position.<span class="hljs-property">coords</span>.<span class="hljs-property">longitude</span>);
  },
  <span class="hljs-function">(<span class="hljs-params">error</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(error),
  { <span class="hljs-attr">enableHighAccuracy</span>: <span class="hljs-literal">true</span> }
);

<span class="hljs-comment">// Hentikan saat tidak perlu — hemat baterai!</span>
navigator.<span class="hljs-property">geolocation</span>.<span class="hljs-title function_">clearWatch</span>(watchId);
</code></pre>
<blockquote>
<p>Selalu <code>clearWatch()</code> saat selesai → kalau tidak, GPS terus menyala.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="menangani-error">Menangani Error</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">onError</span>(<span class="hljs-params">error</span>) {
  <span class="hljs-keyword">switch</span> (error.<span class="hljs-property">code</span>) {
    <span class="hljs-keyword">case</span> error.<span class="hljs-property">PERMISSION_DENIED</span>:
      <span class="hljs-title function_">alert</span>(<span class="hljs-string">&quot;Pengguna menolak akses lokasi&quot;</span>);      <span class="hljs-keyword">break</span>;
    <span class="hljs-keyword">case</span> error.<span class="hljs-property">POSITION_UNAVAILABLE</span>:
      <span class="hljs-title function_">alert</span>(<span class="hljs-string">&quot;Informasi lokasi tidak tersedia&quot;</span>);    <span class="hljs-keyword">break</span>;
    <span class="hljs-keyword">case</span> error.<span class="hljs-property">TIMEOUT</span>:
      <span class="hljs-title function_">alert</span>(<span class="hljs-string">&quot;Permintaan lokasi timeout&quot;</span>);          <span class="hljs-keyword">break</span>;
  }
}
</code></pre>
<p><strong>Selalu siapkan rencana cadangan:</strong></p>
<ul>
<li>Izin ditolak → minta input manual / pakai lokasi default</li>
<li>Timeout → coba lagi dengan <code>enableHighAccuracy: false</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="izin--keamanan">Izin &amp; Keamanan</h1>
<p><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f512.svg" data-marp-twemoji=""/> <strong>Geolocation hanya jalan di context aman:</strong></p>
<ul>
<li><code>https://</code> atau <code>http://localhost</code></li>
<li>Browser <strong>selalu</strong> menampilkan dialog izin</li>
</ul>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f511.svg" data-marp-twemoji=""/> <strong>Status izin bisa dicek (Permissions API):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">navigator.<span class="hljs-property">permissions</span>.<span class="hljs-title function_">query</span>({ <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;geolocation&quot;</span> })
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">result</span>) =&gt;</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(result.<span class="hljs-property">state</span>); <span class="hljs-comment">// &quot;granted&quot; | &quot;prompt&quot; | &quot;denied&quot;</span>
  });
</code></pre>
<blockquote>
<p>Hormati keputusan pengguna. Jangan minta lokasi sebelum benar-benar dibutuhkan.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="5%EF%B8%8F%E2%83%A3-alur-kerja-lbs-di-mobile"><img class="emoji" draggable="false" alt="5️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/35-20e3.svg" data-marp-twemoji=""/> Alur Kerja LBS di Mobile</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="alur-kerja-lbs-langkah-demi-langkah">Alur Kerja LBS: Langkah demi Langkah</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. Pengguna buka aplikasi / fitur lokasi
         │
2. Aplikasi MINTA IZIN akses lokasi
         │ (granted)
3. OS aktifkan sensor → tentukan posisi (GPS/WiFi/Cell)
         │
4. Aplikasi terima koordinat (lat, lon, accuracy)
         │
5. Kirim koordinat ke SERVER (query spasial)
         │
6. Server cari data relevan (POI terdekat, dsb.)
         │
7. Tampilkan hasil di peta / daftar ke pengguna
         │
8. (opsional) watchPosition → update saat bergerak
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="contoh-konkret-warung-makan-terdekat">Contoh Konkret: &quot;Warung Makan Terdekat&quot;</h1>
<ol>
<li>Buka aplikasi → tombol <strong>&quot;Cari di sekitar saya&quot;</strong></li>
<li>Dialog izin lokasi → pengguna <strong>Allow</strong></li>
<li><code>getCurrentPosition</code> → <code>-7.77, 110.38</code> (±15 m)</li>
<li>Kirim ke server: <code>GET /api/warung?lat=-7.77&amp;lon=110.38&amp;radius=1000</code></li>
<li>Server query PostGIS:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> nama, ST_Distance(geom, :titik) <span class="hljs-keyword">AS</span> jarak
<span class="hljs-keyword">FROM</span> warung
<span class="hljs-keyword">WHERE</span> ST_DWithin(geom, :titik, <span class="hljs-number">1000</span>)
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> jarak LIMIT <span class="hljs-number">10</span>;
</code></pre>
</li>
<li>Kembalikan GeoJSON → tampilkan marker + daftar terurut jarak</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="6%EF%B8%8F%E2%83%A3-arsitektur-aplikasi-lbs"><img class="emoji" draggable="false" alt="6️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/36-20e3.svg" data-marp-twemoji=""/> Arsitektur Aplikasi LBS</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="arsitektur-lbs-sederhana">Arsitektur LBS Sederhana</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌─────────────────────────────┐
│         CLIENT              │
│  Browser / Mobile App       │
│  • Geolocation API          │
│  • Peta (OpenLayers/Leaflet)│
│  • UI: tombol, daftar, popup │
└──────────────┬──────────────┘
               │ HTTP/HTTPS (REST/JSON)
               ▼
┌─────────────────────────────┐
│         SERVER             │
│  • API endpoint (REST)      │
│  • Logika query spasial     │
└──────────────┬──────────────┘
               │ SQL spasial
               ▼
┌─────────────────────────────┐
│      DATABASE SPASIAL       │
│  PostGIS / SpatiaLite       │
│  • POI, jalan, area, dsb.   │
└─────────────────────────────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="pembagian-tanggung-jawab">Pembagian Tanggung Jawab</h1>
<table>
<thead>
<tr>
<th>Lapisan</th>
<th>Tugas</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Client</strong></td>
<td>Ambil lokasi (Geolocation), tampilkan peta, kirim request</td>
</tr>
<tr>
<td><strong>Server / API</strong></td>
<td>Terima koordinat, jalankan logika, query data</td>
</tr>
<tr>
<td><strong>Database spasial</strong></td>
<td>Simpan &amp; cari data berdasarkan jarak/area (<code>ST_DWithin</code>, <code>ST_Distance</code>)</td>
</tr>
<tr>
<td><strong>(opsional) Map server</strong></td>
<td>Sajikan basemap / layer (WMS/WFS dari minggu lalu)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Untuk demo, <strong>client-only</strong> pun cukup: data POI bisa inline GeoJSON + hitung jarak di JavaScript.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="versi-paling-sederhana-client-only">Versi Paling Sederhana (Client-Only)</h1>
<p>Tanpa server — cukup untuk belajar konsep:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 1. Ambil posisi pengguna</span>
navigator.<span class="hljs-property">geolocation</span>.<span class="hljs-title function_">getCurrentPosition</span>(<span class="hljs-function">(<span class="hljs-params">pos</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> me = [pos.<span class="hljs-property">coords</span>.<span class="hljs-property">longitude</span>, pos.<span class="hljs-property">coords</span>.<span class="hljs-property">latitude</span>];

  <span class="hljs-comment">// 2. Hitung jarak ke tiap POI (data inline)</span>
  poiList.<span class="hljs-title function_">forEach</span>(<span class="hljs-function"><span class="hljs-params">p</span> =&gt;</span> {
    p.<span class="hljs-property">jarak</span> = <span class="hljs-title function_">haversine</span>(me, [p.<span class="hljs-property">lon</span>, p.<span class="hljs-property">lat</span>]); <span class="hljs-comment">// km</span>
  });

  <span class="hljs-comment">// 3. Urutkan &amp; tampilkan yang terdekat</span>
  poiList.<span class="hljs-title function_">sort</span>(<span class="hljs-function">(<span class="hljs-params">a, b</span>) =&gt;</span> a.<span class="hljs-property">jarak</span> - b.<span class="hljs-property">jarak</span>);
  <span class="hljs-title function_">renderDaftar</span>(poiList.<span class="hljs-title function_">slice</span>(<span class="hljs-number">0</span>, <span class="hljs-number">5</span>));
  <span class="hljs-title function_">tampilkanDiPeta</span>(me, poiList);
});
</code></pre>
<blockquote>
<p>Konsep LBS lengkap <strong>tanpa backend</strong> — ideal untuk latihan.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="menghitung-jarak-haversine">Menghitung Jarak: Haversine</h1>
<p>Jarak antar dua titik lat/lon di permukaan bumi:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">haversine</span>(<span class="hljs-params">[lon1, lat1], [lon2, lat2]</span>) {
  <span class="hljs-keyword">const</span> R = <span class="hljs-number">6371</span>; <span class="hljs-comment">// radius bumi (km)</span>
  <span class="hljs-keyword">const</span> <span class="hljs-title function_">toRad</span> = (<span class="hljs-params">d</span>) =&gt; d * <span class="hljs-title class_">Math</span>.<span class="hljs-property">PI</span> / <span class="hljs-number">180</span>;
  <span class="hljs-keyword">const</span> dLat = <span class="hljs-title function_">toRad</span>(lat2 - lat1);
  <span class="hljs-keyword">const</span> dLon = <span class="hljs-title function_">toRad</span>(lon2 - lon1);
  <span class="hljs-keyword">const</span> a = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">sin</span>(dLat/<span class="hljs-number">2</span>)**<span class="hljs-number">2</span> +
            <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">cos</span>(<span class="hljs-title function_">toRad</span>(lat1)) * <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">cos</span>(<span class="hljs-title function_">toRad</span>(lat2)) *
            <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">sin</span>(dLon/<span class="hljs-number">2</span>)**<span class="hljs-number">2</span>;
  <span class="hljs-keyword">return</span> R * <span class="hljs-number">2</span> * <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">atan2</span>(<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">sqrt</span>(a), <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">sqrt</span>(<span class="hljs-number">1</span>-a));
}
</code></pre>
<blockquote>
<p>Untuk data banyak / area luas → serahkan ke <strong>PostGIS</strong> (<code>ST_Distance</code>).</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="7%EF%B8%8F%E2%83%A3-privasi-akurasi--baterai"><img class="emoji" draggable="false" alt="7️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/37-20e3.svg" data-marp-twemoji=""/> Privasi, Akurasi &amp; Baterai</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="%E2%9A%A0%EF%B8%8F-privasi-lokasi--data-sensitif"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Privasi: Lokasi = Data Sensitif</h1>
<p>Lokasi pengguna bisa mengungkap <strong>rumah, tempat kerja, kebiasaan</strong>.</p>
<p><strong>Prinsip yang harus dipegang:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>Minta izin</strong> secukupnya, saat dibutuhkan saja</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>Akurasi minimum</strong> yang cukup untuk fitur (tidak selalu butuh GPS presisi)</li>
<li><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5d1.svg" data-marp-twemoji=""/> <strong>Jangan simpan</strong> lokasi mentah lebih lama dari perlu</li>
<li><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f512.svg" data-marp-twemoji=""/> Kirim lewat <strong>HTTPS</strong>, jangan log koordinat sembarangan</li>
<li><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4dc.svg" data-marp-twemoji=""/> Patuhi regulasi (mis. <strong>UU PDP</strong> di Indonesia)</li>
</ul>
<blockquote>
<p>Lokasi adalah <strong>kepercayaan</strong> yang diberikan pengguna — jangan dikhianati.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="akurasi--baterai-trade-off">Akurasi &amp; Baterai: Trade-off</h1>
<table>
<thead>
<tr>
<th>Pilihan</th>
<th>Akurasi</th>
<th>Baterai</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>enableHighAccuracy: true</code></td>
<td>Tinggi (GPS)</td>
<td>Boros <img class="emoji" draggable="false" alt="🔋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50b.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🔋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50b.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🔋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50b.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td><code>enableHighAccuracy: false</code></td>
<td>Rendah (WiFi/Cell)</td>
<td>Hemat <img class="emoji" draggable="false" alt="🔋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50b.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td><code>watchPosition</code> terus aktif</td>
<td>—</td>
<td>Sangat boros</td>
</tr>
<tr>
<td><code>maximumAge</code> besar (pakai cache)</td>
<td>—</td>
<td>Hemat</td>
</tr>
</tbody>
</table>
<p><strong>Tips praktis:</strong></p>
<ul>
<li>Pakai high accuracy <strong>hanya</strong> saat navigasi aktif</li>
<li><code>clearWatch()</code> segera setelah selesai</li>
<li>Selalu pasang <code>timeout</code> agar tidak menggantung</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="8%EF%B8%8F%E2%83%A3-demo--debug-lbs"><img class="emoji" draggable="false" alt="8️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/38-20e3.svg" data-marp-twemoji=""/> Demo &amp; Debug LBS</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="demo-apa-yang-ada-di-sekitar-saya">Demo: &quot;Apa yang Ada di Sekitar Saya?&quot;</h1>
<p><strong>Stack:</strong></p>
<ul>
<li>HTML + OpenLayers/Leaflet (klien)</li>
<li>HTML Geolocation API</li>
<li>Data POI sebagai <strong>inline GeoJSON</strong> (client-only)</li>
</ul>
<p><strong>Yang akan ditunjukkan:</strong></p>
<ol>
<li>Tombol &quot;Temukan lokasi saya&quot; → dialog izin</li>
<li>Marker posisi pengguna + lingkaran akurasi</li>
<li>Hitung &amp; urutkan POI terdekat (Haversine)</li>
<li><code>watchPosition</code> → marker mengikuti saat bergerak</li>
<li>Tangani error (izin ditolak / timeout)</li>
</ol>
<p><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> <a href="./index.html"><code>/lbs-mobile-gis/</code></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="tantangan-cara-menguji-lbs">Tantangan: Cara Menguji LBS</h1>
<p>Lokasi berubah-ubah — bagaimana menguji tanpa harus berjalan keliling kota?</p>
<table>
<thead>
<tr>
<th>Cara</th>
<th>Untuk apa</th>
<th>Realisme</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5a5.svg" data-marp-twemoji=""/> <strong>Chrome DevTools → Sensors</strong></td>
<td>Override koordinat di desktop</td>
<td>Cepat, tapi statis</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4f1.svg" data-marp-twemoji=""/> <strong>HP asli + Fake GPS app</strong></td>
<td>Simulasi gerak di perangkat nyata</td>
<td>Mendekati produksi</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🚶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6b6.svg" data-marp-twemoji=""/> <strong>HP asli + jalan beneran</strong></td>
<td>Validasi akhir akurasi GPS</td>
<td>Paling nyata</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Mulai dari <strong>DevTools</strong> (cepat) → naik ke <strong>HP asli</strong> untuk validasi.</p>
</blockquote>
<p><strong>Ingat dua syarat wajib:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f512.svg" data-marp-twemoji=""/> <strong>HTTPS atau <code>localhost</code></strong> — Geolocation tidak jalan di <code>http://</code> biasa</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Izin diberikan</strong> — siapkan juga skenario izin <strong>ditolak</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="debug-1-chrome-devtools--sensors">Debug 1: Chrome DevTools — Sensors</h1>
<p>Override lokasi langsung di browser desktop, <strong>tanpa GPS</strong>.</p>
<p><strong>Langkah:</strong></p>
<ol>
<li>Buka halaman LBS kalian (<code>localhost</code> / HTTPS)</li>
<li><code>F12</code> → buka <strong>DevTools</strong></li>
<li><code>Ctrl/Cmd + Shift + P</code> → ketik <strong>&quot;Sensors&quot;</strong> → <em>Show Sensors</em>
<ul>
<li>(atau: ⋮ → More tools → <strong>Sensors</strong>)</li>
</ul>
</li>
<li>Panel <strong>Location</strong>:
<ul>
<li>Pilih preset kota (Tokyo, Berlin, …), <strong>atau</strong></li>
<li><strong>Other…</strong> → isi <code>Latitude</code> &amp; <code>Longitude</code> sendiri</li>
<li>Pilih <strong>&quot;Location unavailable&quot;</strong> untuk menguji <strong>error</strong>!</li>
</ul>
</li>
<li>Reload / klik tombol lokasi → app memakai koordinat palsu</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Set ke <em>Location unavailable</em> untuk menguji <code>POSITION_UNAVAILABLE</code> &amp; fallback.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="debug-1-sensors--simulasi-gerak">Debug 1: Sensors — Simulasi Gerak</h1>
<p>DevTools juga bisa mensimulasikan <strong>pergerakan</strong> untuk menguji <code>watchPosition</code>.</p>
<ul>
<li>Di panel <strong>Sensors</strong>, ubah Latitude/Longitude → <code>watchPosition</code> akan ter-trigger</li>
<li>Sebagian versi Chrome punya <strong>manage / custom locations</strong> untuk menyimpan titik</li>
<li>Cocok untuk menguji: marker berpindah, daftar &quot;terdekat&quot; ikut berubah</li>
</ul>
<p><strong>Juga berguna di tab Sensors:</strong></p>
<ul>
<li><strong>Orientation</strong> — simulasi kompas (<code>heading</code>) untuk peta yang berputar</li>
<li><strong>Throttling</strong> — uji perilaku di jaringan lambat (3G)</li>
</ul>
<blockquote>
<p>Firefox &amp; Edge punya fitur serupa; Safari lebih terbatas.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="debug-2-hp-asli--fake-gps">Debug 2: HP Asli + Fake GPS</h1>
<p>Uji di perangkat nyata, tapi dengan lokasi yang <strong>kita kontrol</strong>.</p>
<p><strong>Android (paling umum):</strong></p>
<ol>
<li><strong>Settings → About phone</strong> → tap <strong>Build number</strong> 7× → aktif <em>Developer options</em></li>
<li><strong>Developer options → Select mock location app</strong> → pilih aplikasi fake GPS</li>
<li>Install <strong>Fake GPS</strong> (mis. <em>Fake GPS Location</em>, <em>Lockito</em> untuk simulasi rute)</li>
<li>Set titik / gambar rute di app fake GPS → jalankan</li>
<li>Buka halaman LBS di Chrome Android → posisi mengikuti fake GPS</li>
</ol>
<p><strong>iOS:</strong></p>
<ul>
<li>Lebih ketat — butuh <strong>Xcode → Simulator</strong> (Features → Location) atau<br />
tool seperti <strong>iMazing</strong> (set lokasi via Mac). Tidak ada mock app native sederhana.</li>
</ul>
<blockquote>
<p><em>Lockito</em> bisa <strong>menjalankan rute</strong> → bagus untuk uji <code>watchPosition</code> saat &quot;bergerak&quot;.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="debug-2-hp-asli--akses-halaman-lokal">Debug 2: HP Asli — Akses Halaman Lokal</h1>
<p>Halaman di laptop kalian (<code>localhost</code>) — bagaimana membukanya dari HP?</p>
<table>
<thead>
<tr>
<th>Cara</th>
<th>Catatan</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f310.svg" data-marp-twemoji=""/> <strong>Publish (GitHub Pages/Vercel)</strong></td>
<td>HTTPS otomatis — paling mudah</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50c.svg" data-marp-twemoji=""/> <strong><code>chrome://inspect</code> (Port forwarding)</strong></td>
<td>HP via USB → akses <code>localhost</code> laptop, HTTPS aman</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🚇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f687.svg" data-marp-twemoji=""/> <strong>Tunnel (ngrok / cloudflared)</strong></td>
<td>URL HTTPS publik sementara ke server lokal</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="📶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4f6.svg" data-marp-twemoji=""/> <strong>IP LAN (<code>http://192.168.x.x</code>)</strong></td>
<td><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> HTTP biasa → Geolocation <strong>diblokir</strong> kecuali HTTPS</td>
</tr>
</tbody>
</table>
<p><strong>Bonus — remote debugging HP Android:</strong></p>
<ul>
<li>HP via USB → <code>chrome://inspect</code> di Chrome desktop → <strong>inspect</strong> tab HP</li>
<li>Lihat console, Network, dan error langsung dari layar HP</li>
</ul>
<blockquote>
<p>Cara paling bebas masalah: <strong>publish ke HTTPS</strong>, lalu buka di HP.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="checklist-debug-lbs">Checklist Debug LBS</h1>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Halaman jalan di <strong>HTTPS</strong> atau <code>localhost</code>?<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Dialog izin muncul — sudah coba <strong>Allow</strong> <em>dan</em> <strong>Block</strong>?<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Koordinat masuk akal? (cek <code>lat, lon</code> di console)<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Lingkaran akurasi sesuai <code>coords.accuracy</code>?<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <code>watchPosition</code> ter-update saat lokasi diubah?<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <code>clearWatch()</code> dipanggil saat selesai? (cek GPS tidak terus menyala)<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Error (<code>PERMISSION_DENIED</code>, <code>TIMEOUT</code>) ditangani dengan <strong>fallback</strong> jelas?</p>
<blockquote>
<p>Uji jalur <strong>gagal</strong> sama pentingnya dengan jalur <strong>berhasil</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="9%EF%B8%8F%E2%83%A3-wrap-up"><img class="emoji" draggable="false" alt="9️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/39-20e3.svg" data-marp-twemoji=""/> Wrap-up</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="key-takeaways">Key Takeaways</h1>
<ol>
<li><strong>LBS</strong> = layanan yang jawabannya tergantung <strong>di mana</strong> pengguna berada</li>
<li>Posisi berasal dari <strong>GPS, WiFi, Cell, IP</strong> — sering digabung (hybrid)</li>
<li><strong>HTML Geolocation API</strong>: <code>getCurrentPosition</code> &amp; <code>watchPosition</code></li>
<li>Selalu <strong>HTTPS</strong>, selalu <strong>minta izin</strong>, selalu siapkan <strong>fallback error</strong></li>
<li>Alur LBS: izin → posisi → kirim ke server → query spasial → tampilkan</li>
<li>Arsitektur sederhana: <strong>client → API → database spasial</strong>; demo cukup client-only</li>
<li><strong>Privasi, akurasi, dan baterai</strong> adalah trade-off yang harus disadari</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="refleksi">Refleksi</h1>
<p><img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f914.svg" data-marp-twemoji=""/> Kapan aplikasi sebaiknya pakai high accuracy, kapan tidak?<br />
<img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f914.svg" data-marp-twemoji=""/> Apa risiko privasi menyimpan riwayat lokasi pengguna?<br />
<img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f914.svg" data-marp-twemoji=""/> Bagaimana aplikasi tetap berguna jika pengguna <strong>menolak</strong> izin lokasi?<br />
<img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f914.svg" data-marp-twemoji=""/> Untuk &quot;cari terdekat&quot; data 1 juta titik — hitung di klien atau di PostGIS? Kenapa?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
<h1 id="latihan-mandiri">Latihan Mandiri</h1>
<p>Bangun <strong>aplikasi LBS sederhana</strong>, lalu publish.</p>
<p><strong>Minimal:</strong></p>
<ul>
<li>Ambil lokasi pengguna via <strong>Geolocation API</strong></li>
<li>Tampilkan posisi pengguna di peta (marker + lingkaran akurasi)</li>
<li>Tampilkan <strong>minimal 5 POI</strong> dan urutkan berdasarkan <strong>jarak</strong></li>
<li>Tangani kasus izin ditolak / error</li>
</ul>
<p><strong>Bonus:</strong></p>
<ul>
<li><code>watchPosition</code> — marker mengikuti pergerakan</li>
<li>Filter POI berdasarkan radius (slider)</li>
<li>Backend nyata dengan PostGIS (<code>ST_DWithin</code>)</li>
<li>Geofencing sederhana (notifikasi saat masuk area)</li>
</ul>
<p><strong>Keluaran:</strong> link demo (HTTPS) + repo source.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45" data-size="16:9">
