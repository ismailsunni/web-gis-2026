    <title>Mini WebGIS — Marker Example · Web GIS 2026</title>
    <style>
        #map {
            width: 100%;
            height: 400px;
            background: linear-gradient(to bottom, lightblue, lightgreen);
            position: relative;
            border: 1px solid #ccc;

        .marker {
            width: 12px;
            height: 12px;
            background: red;
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
