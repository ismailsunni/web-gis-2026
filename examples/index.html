<!DOCTYPE html>
<html>

<head>
    <title>Mini WebGIS</title>
    <style>
        #map {
            width: 100%;
            height: 400px;
            background: linear-gradient(to bottom, lightblue, lightgreen);
            position: relative;
            border: 1px solid #ccc;
        }

        .marker {
            width: 12px;
            height: 12px;
            background: red;
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Mini WebGIS</h2>
    <button id="btnAdd">Add Marker</button>
    <div id="map"></div>
    <script src="app.js"></script>
</body>

</html>
