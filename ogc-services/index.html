<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGC Services — WMS & WFS Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.8.0/dist/ol.css" />
    <style>
        :root {
            --panel-bg: rgba(255, 255, 255, 0.94);
            --panel-border: rgba(15, 23, 42, 0.08);
            --panel-shadow: 0 12px 30px rgba(15, 23, 42, 0.14);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0f172a;
            --accent-soft: #f1f5f9;
            --wms-color: #2563eb;
            --wfs-color: #059669;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .ol-popup {
            position: absolute;
            background: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
            max-width: 280px;
            transform: translate(-50%, -110%);
            line-height: 1.45;
        }

        .ol-popup b {
            font-size: 14px;
        }

        .ol-popup .src-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            margin-bottom: 4px;
        }

        .ol-popup .src-tag.wms { background: var(--wms-color); }
        .ol-popup .src-tag.wfs { background: var(--wfs-color); }

        .ol-popup table {
            border-collapse: collapse;
            margin-top: 4px;
            font-size: 12px;
        }

        .ol-popup table td {
            padding: 2px 6px 2px 0;
            vertical-align: top;
        }

        .ol-popup table td:first-child {
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Layer panel */
        #layer-panel {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
            min-width: 240px;
            padding: 0.85rem 1rem;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(10px);
            font-size: 13px;
        }

        #layer-panel h3 {
            margin: 0 0 0.5rem 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0;
            cursor: pointer;
        }

        .layer-toggle input { cursor: pointer; }

        .layer-toggle .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .layer-toggle .swatch.wms { background: var(--wms-color); }
        .layer-toggle .swatch.wfs { background: var(--wfs-color); }

        .layer-toggle code {
            font-size: 11px;
            color: var(--text-muted);
        }

        #config-hint {
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px solid var(--panel-border);
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        #config-hint code {
            background: var(--accent-soft);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* Request log */
        #request-log {
            position: fixed;
            left: 1rem;
            top: 1rem;
            z-index: 100;
            max-width: 420px;
            padding: 0.75rem 0.9rem;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(10px);
            font-size: 11px;
            color: var(--text-muted);
            max-height: 40vh;
            overflow-y: auto;
        }

        #request-log h3 {
            margin: 0 0 0.4rem 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        #request-log .entry {
            padding: 0.35rem 0;
            border-bottom: 1px dashed var(--panel-border);
            word-break: break-all;
            font-family: "SFMono-Regular", Consolas, monospace;
            line-height: 1.4;
        }

        #request-log .entry:last-child { border-bottom: none; }

        #request-log .entry .label {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            color: #fff;
            margin-right: 4px;
            font-family: "Segoe UI", sans-serif;
        }

        #request-log .entry .label.wms { background: var(--wms-color); }
        #request-log .entry .label.wfs { background: var(--wfs-color); }
        #request-log .entry .label.gfi { background: #f59e0b; }

        #attribution-display {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            z-index: 100;
            padding: 0.45rem 0.75rem;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(10px);
            font-size: 11px;
            color: var(--text-muted);
        }

        #attribution-display a {
            color: inherit;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            #layer-panel {
                top: auto;
                left: 0.75rem;
                right: 0.75rem;
                bottom: 1rem;
            }

            #request-log {
                left: 0.75rem;
                right: 0.75rem;
                max-width: none;
                max-height: 30vh;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="layer-panel">
        <h3>Layers</h3>
        <label class="layer-toggle">
            <input type="checkbox" id="toggle-wms" checked>
            <span class="swatch wms"></span>
            <span>WMS <code>(TileWMS)</code></span>
        </label>
        <label class="layer-toggle">
            <input type="checkbox" id="toggle-wfs" checked>
            <span class="swatch wfs"></span>
            <span>WFS <code>(GeoJSON)</code></span>
        </label>
        <div id="config-hint">
            Edit <code>GEOSERVER_BASE</code>, <code>WORKSPACE</code>,
            and <code>LAYER</code> at the top of <code>app.js</code>.
        </div>
    </div>

    <div id="request-log">
        <h3>Request log</h3>
        <div id="request-log-entries"></div>
    </div>

    <div id="attribution-display">© OpenStreetMap · WMS/WFS via GeoServer</div>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.8.0/dist/ol.js"></script>
    <script src="app.js"></script>
</body>

</html>
