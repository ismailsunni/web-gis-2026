<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini WebGIS - Client Side Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 450px;
            background-color: #d0e7ff;
            position: relative;
            border: 2px solid #333;
            margin-top: 10px;
            overflow: hidden;
        }

        .marker {
            width: 12px;
            height: 12px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
        }

        .controls {
            margin-top: 10px;
        }

        button {
            padding: 8px 12px;
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Mini WebGIS (Without Library)</h2>

    <div class="controls">
        <button id="btnAdd">Add Random Marker</button>
        <button id="btnClear">Clear All Markers</button>
    </div>

    <div id="map"></div>

    <script src="app.js"></script>

</body>
</html>
