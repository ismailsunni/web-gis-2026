<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
    <title>Mini WebGIS — Internet Programming · Web GIS 2026</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 450px;
            background-color: #d0e7ff;
            position: relative;
            border: 2px solid #333;
            margin-top: 10px;
            overflow: hidden;
        }

        .marker {
            width: 12px;
            height: 12px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
        }

        .controls {
            margin-top: 10px;
        }

        button {
            padding: 8px 12px;
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a4e2f8be-91ae-48a3-a1ba-0b50d7485e05"></script>
</head>
<body>

    <a href="../" style="display:inline-block;margin-bottom:0.8rem;color:#2563eb;text-decoration:none;font:500 0.85rem -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">← Home</a>
    <h2>Mini WebGIS (Without Library)</h2>

    <div class="controls">
        <button id="btnAdd">Add Random Marker</button>
        <button id="btnClear">Clear All Markers</button>
    </div>

    <div id="map"></div>

    <script src="app.js"></script>

</body>
</html>
